<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Innovic Portal – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #00ADE7;
      --primary-dark: #0086C9;
      --primary-light: #E8F7FD;
      --primary-subtle: #F0FAFF;
      --accent: #2563EB;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 10px 30px -5px rgba(0, 173, 231, 0.15), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --tr: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: linear-gradient(135deg, #F0FAFF 0%, #FAFEFF 50%, #E8F7FD 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .glow-1 {
      position: absolute; width: 450px; height: 450px; top: -100px; left: -100px;
      background: radial-gradient(circle, rgba(0, 173, 231, 0.12) 0%, transparent 70%);
      border-radius: 50%; pointer-events: none;
    }
    .glow-2 {
      position: absolute; width: 400px; height: 400px; bottom: -80px; right: -80px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      border-radius: 50%; pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 173, 231, 0.35);
    }
    .logo-badge svg { width: 24px; height: 24px; fill: white; }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .brand-title span { color: var(--primary); }
    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Role Tabs */
    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .role-tab {
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--tr);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .role-tab svg { width: 15px; height: 15px; fill: currentColor; }
    .role-tab.active {
      background: var(--surface);
      color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .input-field {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      transition: var(--tr);
      outline: none;
    }
    .input-field:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(0, 173, 231, 0.12);
    }

    .form-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .remember-me input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 100px;
      color: white;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 173, 231, 0.35);
      transition: var(--tr);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 173, 231, 0.45);
    }

    /* Quick Demo Login Pills */
    .demo-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px dashed var(--border);
      text-align: center;
    }
    .demo-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .demo-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .demo-pill {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid rgba(0, 173, 231, 0.2);
      padding: 7px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .demo-pill:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.03);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--tr);
    }
    .back-home:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="login-container">
    <div class="brand-header">
      <a href="index.html" class="brand-logo" style="display:inline-block;margin-bottom:14px;">
        <img src="images/logo.png" alt="Innovic Solutions" style="height:52px;width:auto;display:block;margin:0 auto;" />
      </a>
      <p class="brand-subtitle" id="portalSub">Sign in to your student learning dashboard</p>
    </div>

    <!-- Role Switcher Tabs -->
    <div class="role-tabs">
      <button class="role-tab active" data-role="student" onclick="setRole('student')">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
        Student
      </button>
      <button class="role-tab" data-role="staff" onclick="setRole('staff')">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        Staff
      </button>
      <button class="role-tab" data-role="admin" onclick="setRole('admin')">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
        Admin
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" id="userLabel">Student ID / Email</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="username" class="input-field" placeholder="e.g. subhash.c@innovic.in" required/>
        </div>
      </div>

      <div class="form-group">
        <div class="form-label">
          <span>Password</span>
          <a href="#" class="forgot-link">Forgot?</a>
        </div>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required/>
        </div>
      </div>

      <div class="form-extras">
        <label class="remember-me">
          <input type="checkbox" checked/>
          <span>Remember this device</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Enter Student Portal</span>
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/></svg>
      </button>
    </form>

    <!-- 1-Click Instant Demo Launchers -->
    <div class="demo-section">
      <div class="demo-title">⚡ 1-Click Instant Demo Access</div>
      <div class="demo-buttons">
        <button class="demo-pill" onclick="quickLogin('student')">👨‍🎓 Student View</button>
        <button class="demo-pill" onclick="quickLogin('staff')">👩‍🏫 Staff Portal</button>
        <button class="demo-pill" onclick="quickLogin('admin')">⚡ Admin Console</button>
      </div>
    </div>

    <a href="index.html" class="back-home">← Back to Innovic Solutions Website</a>
  </div>

  <script>
    let currentRole = 'student';

    const roleConfigs = {
      student: {
        title: 'Sign in to your student learning dashboard',
        label: 'Student ID / Email',
        placeholder: 'e.g. subhash.c@innovic.in',
        btnText: 'Enter Student Portal',
        defaultUser: 'subhash.c@innovic.in'
      },
      staff: {
        title: 'Sign in to Staff Academic & Operations Portal',
        label: 'Staff Official Email',
        placeholder: 'e.g. suprita@innovic.in',
        btnText: 'Enter Staff Portal',
        defaultUser: 'suprita@innovic.in'
      },
      admin: {
        title: 'Sign in to Admin Command Center',
        label: 'Admin ID / Security Key',
        placeholder: 'e.g. admin@innovic.in',
        btnText: 'Enter Admin Console',
        defaultUser: 'admin@innovic.in'
      }
    };

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(t => {
        t.classList.toggle('active', t.getAttribute('data-role') === role);
      });
      const cfg = roleConfigs[role];
      document.getElementById('portalSub').textContent = cfg.title;
      document.getElementById('userLabel').textContent = cfg.label;
      document.getElementById('username').placeholder = cfg.placeholder;
      document.getElementById('username').value = cfg.defaultUser;
      document.getElementById('password').value = 'innovic123';
      document.getElementById('submitBtn').querySelector('span').textContent = cfg.btnText;
    }

    function quickLogin(role) {
      window.location.href = `portal.html?role=${role}`;
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = `<span>Signing in...</span>`;
      btn.style.opacity = '0.8';
      setTimeout(() => {
        window.location.href = `portal.html?role=${currentRole}`;
      }, 400);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const initialRole = urlParams.get('role') || 'student';
    setRole(initialRole);
  </script>
</body>
</html>
